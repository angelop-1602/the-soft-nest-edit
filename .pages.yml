# Pages CMS: https://app.pagescms.org
# Sign in with the GitHub account that owns this repository.
media:
  input: static/uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: Post title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Last substantial update (optional)
        type: date
        description: Set only if you materially update the article. Used in structured data and sitemap.
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Living Room, Bedroom, Small Spaces, Home Organization, Lifestyle]
      - name: description
        label: Search description (SEO)
        type: text
        required: true
        description: Aim for 120–160 characters; also shown on Pinterest shares.
      - name: image
        label: Cover image
        type: image
        required: true
      - name: image_alt
        label: Cover image description
        type: string
        required: true
      - name: featured
        label: Feature on home page
        type: boolean
      - name: published
        label: Published / visible on website
        type: boolean
        description: Leave off to save a draft. No preview is published for drafts.
      - name: products
        label: Related affiliate products
        type: reference
        description: Select products from Affiliate Products. Only published products with valid retailer links appear on the website.
        options:
          collection: products
          multiple: true
          max: 8
          search: "title,retailer,category"
          value: "{path}"
          label: "{primary} — {retailer}"
      - name: body
        label: Article body
        type: rich-text
        required: true
  - name: products
    label: Journal Affiliate Products
    type: collection
    path: content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, retailer, category, published, affiliate]
    fields:
      - name: title
        label: Product name
        type: string
        required: true
      - name: retailer
        label: Store / retailer
        type: string
        required: true
        description: The retailer customers visit after clicking the product.
      - name: category
        label: Product category
        type: select
        required: true
        options:
          values: [Living Room, Bedroom, Small Spaces, Home Organization, Lifestyle]
      - name: image
        label: Product image
        type: image
        description: Upload an image you own or are licensed to use; check the affiliate program's image rules.
      - name: image_alt
        label: Product image description
        type: string
      - name: summary
        label: Why this product is relevant
        type: text
        required: true
        description: Keep this original and useful. Do not claim to have tested an item unless you actually have.
      - name: product_url
        label: Retailer / affiliate URL (https)
        type: string
        description: Paste your approved tracking link. A product without a valid https URL will not be published.
      - name: price_note
        label: Optional price note
        type: string
        description: Prefer a non-numeric price range or leave blank; prices and some affiliate-program rules change.
      - name: affiliate
        label: Affiliate link / may earn commission
        type: boolean
        description: Enable only when the URL is an affiliate link. The website adds sponsored link attributes and disclosure.
      - name: featured_shop
        label: Highlight on homepage
        type: boolean
      - name: published
        label: Published / visible on website
        type: boolean
        description: Leave off while preparing a product; only published products with valid links appear.
      - name: body
        label: Editor notes (optional)
        type: rich-text
        description: Not displayed on the public site, but stored in GitHub. Do not store confidential information.
  - name: store_products
    label: Dropshipping Store Products
    type: collection
    path: content/store-products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, subcategory, price_usd, published, ready_to_sell]
    fields:
      - name: title
        label: Product title
        type: string
        required: true
      - name: category
        label: Shop category
        type: select
        required: true
        options:
          values: [Wall Decor, Lighting & Lamps, Vases & Decorative Containers, Artificial Plants & Flowers, Mirrors, Candles & Fragrances, Decorative Accessories, Cushions & Pillows, Rugs & Carpets, Curtains & Window Decor, Table Decor, Storage & Organization, Clocks, Decorative Furniture, Seasonal & Holiday Decor, Religious & Spiritual Decor, Kitchen & Dining Decor, Bathroom Decor, Bedroom Decor, Outdoor & Garden Decor, Natural & Handmade Decor, Home Fragrance Accessories, Personalized Decor, Bookshelf & Office Decor]
      - name: subcategory
        label: Product type (exact wording from selected collection)
        type: string
        required: true
        description: Use one of the subcategories shown on your Shop collection page.
      - name: image
        label: Product image you have permission to use
        type: image
        required: true
      - name: image_alt
        label: Image description
        type: string
        required: true
      - name: summary
        label: Product description
        type: text
        required: true
      - name: price_usd
        label: Sale price in USD (optional for preview)
        type: number
        required: false
        description: Show USD price only when confirmed. Leave blank for a preview.
      - name: checkout_url
        label: Tested hosted checkout URL (https, optional for preview)
        type: string
        required: false
        description: Use YOUR verified per-product PayPal or approved gateway checkout link. Not a CJ supplier or Amazon link.
      - name: shipping_details
        label: Verified US shipping information
        type: text
        required: false
      - name: return_details
        label: Your customer return and refund conditions
        type: text
        required: false
      - name: sku
        label: Internal CJ SKU / sourcing reference (optional)
        type: string
      - name: featured
        label: Feature product first
        type: boolean
      - name: ready_to_sell
        label: Enable purchase button (only after payment, stock and policies are verified)
        type: boolean
        description: Leave off for a preview. When enabled, valid USD price, HTTPS checkout link, shipping and return terms are all required.
      - name: published
        label: Show in storefront catalog
        type: boolean
        description: A published product may be a non-purchasable preview; Buy securely appears only when ready_to_sell is enabled and all required sale details are complete.
      - name: body
        label: Private editorial notes (no secrets)
        type: rich-text
  - name: settings
    label: Site settings
    type: file
    path: data/site.yml
    fields:
      - name: name
        label: Brand name
        type: string
        required: true
      - name: tagline
        label: Brand tagline
        type: string
      - name: description
        label: Site description (SEO)
        type: text
      - name: site_url
        label: Canonical website address
        type: string
        description: After deployment, enter your full https:// address. Leave blank until then.
      - name: pinterest_url
        label: Pinterest profile URL
        type: string
        description: Leave blank until your Pinterest profile is live.
      - name: contact_email
        label: Contact email
        type: string
        description: Leave blank until you have a public business email.
